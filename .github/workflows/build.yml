name: Build Motion VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Motion-VST3-Windows
          - os: macos-latest
            name: Motion-VST3-macOS-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --target Motion_VST3 --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          find build -type d -name "Motion.vst3" -exec cp -R {} dist/ \;
          ls -R dist | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist
          if-no-files-found: error
